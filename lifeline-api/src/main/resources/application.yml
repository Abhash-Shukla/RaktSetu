server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: lifeline-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lifeline_db}
    username: ${DB_USERNAME:lifeline_user}
    password: ${DB_PASSWORD:lifeline_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

lifeline:
  jwt:
    # 256-bit secret key (development fallback, overridden via JWT_SECRET in production)
    secret: ${JWT_SECRET:LifeLineRaktSetuSecretKeyMustBeAtLeast256BitsLongForHMACSHA256Security2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  matching:
    default-system: "S6"
    tier0-radius-km: 25.0
    top-n: 10
  security:
    public-intake-rate-limit-per-minute: 30
  nlp:
    provider: ${NLP_PROVIDER:fake}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    timeout-ms: ${NLP_TIMEOUT_MS:5000}
    confidence-threshold: ${NLP_CONFIDENCE_THRESHOLD:0.60}
