  zoneCount: 40              # P-04
  densityLognormalSigma: 0.8 # P-04
  roadFactor: 1.3            # P-04
  horizonDays: 30            # P-05
  meanContactsPerDonor: 4.0  # P-23
  historyMonths: 18          # P-23

demographics:
  maleShare: 0.94            # P-27
  femaleShare: 0.06          # P-27
  availabilityShare: 0.70    # P-12
  currentLocationShare: 0.30 # P-13
  freshnessWindowHours: 24   # P-13
  cooldownDaysMale: 90       # P-10
  cooldownDaysFemale: 120    # P-10
  maxDonationAgeDays: 365    # P-11

latentDonor:
