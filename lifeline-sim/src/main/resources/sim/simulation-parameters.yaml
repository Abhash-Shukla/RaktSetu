  expiryMinutesCritical: 20  # P-25
  expiryMinutesUrgent: 45    # P-25
  expiryMinutesRoutine: 180  # P-25

responseModels:
  m1:
    urgencyCriticalBonus: 0.15 # P-21 (+15% relative)
  m2:
    fatigueFactor: 0.80        # P-19 (x0.8 per contact in previous 30 days)
